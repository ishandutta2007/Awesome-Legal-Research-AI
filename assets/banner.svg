<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a; #1e1b4b; #0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b; #312e81; #1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7; #4f46e5; #0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Tech Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Animated Floating Glow Orbs -->
  <circle cx="150" cy="80" r="60" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="220" r="80" fill="#818cf8" opacity="0.2" filter="url(#glow)">
    <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Scales of Justice + AI Icon Vector -->
  <g transform="translate(120, 90)" fill="none" stroke="url(#text-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Scales Base & Pillar -->
    <path d="M 60 120 L 60 20 M 30 120 L 90 120 M 45 20 L 75 20" />
    <!-- Beam -->
    <path d="M 15 40 L 105 40" />
    <!-- Left Pan -->
    <path d="M 15 40 L 0 75 L 30 75 Z" />
    <!-- Right Pan -->
    <path d="M 105 40 L 90 75 L 120 75 Z" />
    <!-- AI Sparkles -->
    <path d="M 60 20 M 130 10 L 135 25 L 150 30 L 135 35 L 130 50 L 125 35 L 110 30 L 125 25 Z" fill="url(#text-grad)" opacity="0.9">
      <animate attributeName="transform" type="rotate" values="0 130 30; 360 130 30" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Banner Title Text -->
  <text x="320" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="url(#text-grad)" filter="url(#glow)">
    Awesome Legal Research AI
  </text>

  <!-- Subtitle Text -->
  <text x="320" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Curated SaaS Platforms, Legal Tech AI &amp; Open-Source Repositories
  </text>

  <!-- Dynamic Pulse Status Pill -->
  <g transform="translate(320, 215)">
    <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <circle cx="20" cy="17" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#38bdf8">
      Updated for 2026 Ecosystem
    </text>
  </g>
</svg>
